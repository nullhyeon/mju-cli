<script>
  const open_cmmt_reply_arr = [];

  function cmmtList(menu_seq,brd_id,cmmt_brd_id,auth,menu_seq2, target_cmmt) {
    $.ajax({
      url: "/ilos/cls/st/co/cmmt_list.acl",
      type: "POST",
      data: { 
        KJKEY    : "A20243JEJ022150766",
        MENU_SEQ : menu_seq,
        MENU_SEQ2 : menu_seq2,
        BRD_ID : brd_id,
        CMMT_BRD_ID : cmmt_brd_id,
        auth : auth,
        encoding : "utf-8"
      },
      async: false,
      success: function(data){
        $("#comment_form_"+menu_seq).html(data);
        
        if(open_cmmt_reply_arr.length > 0){
          for(let i = 0; i < open_cmmt_reply_arr.length; i++){
            $('#cmmt_reply_wrap_btn_'+ open_cmmt_reply_arr[i]).addClass('active');
            $('#cmmt_reply_wrap_btn_'+ open_cmmt_reply_arr[i]).parent().addClass('active');
            $('#comment_reply_list_wrap_'+open_cmmt_reply_arr[i]).css('display', 'flex');
          }
        }
        
        if(target_cmmt){
          setTimeout(function(){
            if($('#comment_'+target_cmmt).parent().hasClass('comment_reply_list_wrap')){
              const cmmt_wrap = $("#comment_"+target_cmmt).closest(".comment_list_wrap").find("button.cmmt_reply_wrap_header");
              const parent_cmmt_num = cmmt_wrap.data('num');
              
              cmmt_wrap.addClass('active');
              $('#comment_reply_list_wrap_'+parent_cmmt_num).css('display', 'flex');    
              checkOpenCmmtReplyWrap(parent_cmmt_num, 1);
              
              open_cmmt_reply_arr.push(parent_cmmt_num);
            }
            
            const window_offsetTop = document.querySelector('html').scrollTop;
            const offset = $('#comment_'+target_cmmt).offset();
            $('#comment_'+target_cmmt).closest('.ui-dialog-form').animate({scrollTop: offset.top - window_offsetTop - 100}, 500);
            showTatgetContent($('#comment_'+target_cmmt));
          }, 100);
        }
        
      },
      error : function(jqXHR, exception){
        ajaxErrorMsg(jqXHR, exception);
        return false;
      }
    });
  }
  function insertCmmt(obj,menu_seq,brd_id,cmmt_brd_id,auth,menu_seq2) {

      alert("댓글을 입력하세요.");
      $("#wrtExplain_"+menu_seq).focus();
      return;
    }    
  
    if(getLength(cm)  > 1800 ) {

      $("#wrtExplain_"+menu_seq).focus();
      return;
    }
    
    $.ajax({
      url: "/ilos/cls/st/co/cmmt_insert.acl",
      type: "POST",

        MENU_SEQ2 : menu_seq2,
        OPEN_YN : $("input:checkbox[id='OPEN_YN"+menu_seq+"']").is(":checked") ? "N" : "Y",
        CMT : cm,
        ky  : "A20243JEJ022150766",
        ud  : "60212177",
        encoding : "utf-8"
      },
      async: false,

        if(data.isError){
          alert(data.message);
        }
        cmmtList(menu_seq,brd_id,cmmt_brd_id,auth,menu_seq2);

          showDetailUserList();
        }

          listPage();
        }
      },
      error : function(jqXHR, exception){
        ajaxErrorMsg(jqXHR, exception);
        return false;
      }
    });
  }

  function resetEditCmmt(num,menu_seq) {
    $(".comment_body").show();
    $(".comment_body.edit").hide();
    $("#comment_body_edit"+menu_seq+num).hide();
  }
  function editCmmt(num,menu_seq,open_yn) {
    var _txt_val = $('#cmt_txt_val_'+num).val();
    var _editor = $('#wrtExplain_'+menu_seq+num);
    $('#wrtExplain_'+menu_seq).val("");
    resetEditCmmt(num,menu_seq);
    $("#comment_body"+menu_seq+num).hide();
    $("#comment_body_edit"+menu_seq+num).show();
    _editor.val(_txt_val);
    _lec(_editor);
    _editor.focus();
    textareaAutoResize(_editor);
    if("N" == open_yn){
      $("#reg_nm"+menu_seq+num).removeClass("regnm_hide");
      $("#reg_nm"+menu_seq+num).addClass("regnm_hide");
      $('input:checkbox[id="OPEN_YN'+menu_seq+num+'"]').prop("checked",true);
    }else{
      $("#reg_nm"+menu_seq+num).removeClass("regnm_hide");
      $('input:checkbox[id="OPEN_YN'+menu_seq+num+'"]').prop("checked",false);
    }
  }
  function _lec(obj){
    obj.parent().find(".ext_len").html(getLength(trim(obj.val())));
    if(getLength(trim(obj.val())) > 0){
      obj.closest('.comment_textarea_wrap').find('button.cmmt_save').removeClass('disabled');
    }else{
      obj.closest('.comment_textarea_wrap').find('button.cmmt_save').addClass('disabled');
    }
  }
  
  function cancelCmmtReply(cmmt_num){
    var isClose = true;
    if($('#wrtExplain2_'+cmmt_num).val() != ''){
      if(!confirm("답글 작성을 취소 하시겠습니까?")){
        isClose = false;
      }
    }
    if(isClose){
      $('#comment_reply_body_'+cmmt_num).hide();
      $('#wrtExplain2_'+cmmt_num).val('');
      $('#cmmt_reply_btn_'+cmmt_num).removeClass('active');
      $('#reg_nm_edit'+cmmt_num).removeClass('regnm_hide');
      $('#OPEN_YN_EDIT'+cmmt_num).prop('checked', false)
    }
  }
  
  function insertCmmtReply(obj,menu_seq,brd_id,cmmt_brd_id,auth,menu_seq2,cmmt_num) {
    if(obj.hasClass('disabled')){
      return false;
    }
    
    const cm = trim($("#wrtExplain2_"+cmmt_num).val());
    if(cm.length == 0){
      alert("댓글을 입력하세요.");
      $("#wrtExplain2_"+cmmt_num).focus();
      return;
    }
  
    if(getLength(cm)  > 1800 ) {
      alert(imaxsoft.i18n.Resource.getString('err.cmmtLimitSize',{'$size':getLength(cm)+'byte'}));
      $("#wrtExplain2_"+cmmt_num).focus();
      return;
    }
    
    const ref_cmmt_num = obj.data('r');
    const parent_cmmt_num = obj.data('p');
    
    const open_yn = obj.closest('.comment_body.edit').find('input:checkbox[name=OPEN_YN]').is(':checked') ? "N" : "Y";
    
    $.ajax({
      url: "/ilos/cls/st/co/cmmt_insert.acl",
      type: "POST",
      data: { 
        BRD_ID : brd_id,
        auth : auth,
        MENU_SEQ : menu_seq,
        MENU_SEQ2 : menu_seq2,
        CMT : cm,
        REF_CMMT_NUM		: ref_cmmt_num,

        ky  : "A20243JEJ022150766",
        ud  : "60212177",
        encoding : "utf-8"
      },
      async: false,
      success: function(data){
        if(data.isError){
          alert(data.message);
        }
        checkOpenCmmtReplyWrap(ref_cmmt_num, 2);
        cmmtList(menu_seq,brd_id,cmmt_brd_id,auth,menu_seq2);
        
        if(brd_id == 'K009'){
          showDetailUserList();
        }        
      },
      error : function(jqXHR, exception){
        ajaxErrorMsg(jqXHR, exception);
        return false;
      }
    });
  }
  
  
  function checkOpenCmmtReplyWrap(cmmt_num, dv){
    
    cmmt_num = Number(cmmt_num);
    if(dv == 1){
      open_cmmt_reply_arr.includes(cmmt_num) ? open_cmmt_reply_arr.splice(open_cmmt_reply_arr.indexOf(cmmt_num), 1) 
          																	 : open_cmmt_reply_arr.push(cmmt_num);
    }else if(dv == 2){
      !open_cmmt_reply_arr.includes(cmmt_num) && open_cmmt_reply_arr.push(cmmt_num);
    }
  }
